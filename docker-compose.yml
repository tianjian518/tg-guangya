# TG → 光鸭 自动转存：一键部署
#
# 启动：   docker compose up -d
# 停止：   docker compose down
# 升级：   docker compose down && docker compose up -d --build
# 数据：   宿主机的 ./data 目录挂载到容器 /data，配置/数据库/会话都在里面，容器删了也不丢。
#
# 访问：   http://localhost:8000  （首次进入「系统设置 → 光鸭账号」扫码登录）
services:
  tg-guangya:
    build: .
    container_name: tg-guangya
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data        # 持久化数据卷（配置、去重库、TG 会话）
    environment:
      - DATA_DIR=/data
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
