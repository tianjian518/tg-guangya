name: Verify Magnet Channels

# 在 GitHub runner（网络不受限）上多页抓取 t.me/s/<频道>，实测影视磁力产出。
# 触发：手动 Run workflow，或 push 改动 seeds/candidates_verify.txt。
# 结果打印到日志。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seeds/candidates_verify.txt"
      - "tools/crawl_and_verify.py"
      - "verify_channels.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q requests PyYAML

      - name: Verify channels (4 pages)
        id: verify
        run: |
          CHS=$(grep -v '^#' seeds/candidates_verify.txt | grep -v '^$' | tr '\n' ' ')
          echo "候选: $CHS"
          python3 verify_channels.py --channels $CHS --pages 4 --delay 0.4 --keep 2>&1 | tee /tmp/verify_full.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: verify-result
          path: /tmp/verify_full.txt
