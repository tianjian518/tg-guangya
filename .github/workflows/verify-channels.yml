name: Verify Magnet Channels

# 一次性体检：在 GitHub runner（网络不受限）上挖掘并实测影视磁力频道。
# 手动触发：Actions -> Verify Magnet Channels -> Run workflow
# 结果打印到日志，同时上传 keep_channels.txt artifact。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/crawl_and_verify.py"
      - "seeds/candidates_verify.txt"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q requests PyYAML

      - name: Crawl and verify
        id: verify
        run: |
          python3 tools/crawl_and_verify.py 2>&1 | tee /tmp/verify_full.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: verify-result
          path: |
            /tmp/verify_full.txt
            /tmp/keep_channels.txt
