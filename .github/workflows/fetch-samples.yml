# 临时诊断工作流：从 GitHub 机房抓取各磁力搜索站的响应样本，
# 直接 commit 到专用分支 search-samples（沙箱连 artifact/log 下载域，
# 只 git 协议可达）。
name: fetch-samples
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch search API samples
        run: |
          mkdir -p samples
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          grab() { code=$(curl -sS -H "User-Agent: $UA" --max-time 20 -o "samples/$1" -w "%{http_code}" "$2" || echo ERR); echo "$1 -> $code"; }
          grab yts_interstellar.json  "https://yts.mx/api/v2/list_movies.json?query_term=interstellar&limit=3&sort_by=seeds"
          grab nyaa_en.xml            "https://nyaa.si/?page=rss&q=interstellar"
          grab nyaa_cn_doupo.xml      "https://nyaa.si/?page=rss&q=%E6%96%97%E7%A0%B4%E8%8B%8D%E7%A9%B9"
          grab nyaa_cn_juqing.xml     "https://nyaa.si/?page=rss&q=%E5%BA%86%E4%BD%99%E5%B9%B4"
          grab solid_v1.json          "https://solidtorrents.to/api/v1/search?q=interstellar"
          grab solid_html.html        "https://solidtorrents.to/search?q=interstellar"
          grab bt4g_search.html       "https://bt4g.org/search/interstellar"
          grab bt4g_cn.html           "https://bt4g.org/search/%E5%BA%86%E4%BD%99%E5%B9%B4"
          grab apibay_query.json      "https://apibay.org/q.php?q=interstellar&cat=0"
          ls -la samples/
      - name: Commit samples to branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "gh-actions"
          git checkout -q --detach
          git add -f samples/
          git commit -q -m "search samples $(date -u +%FT%TZ)"
          git push -q -f origin HEAD:refs/heads/search-samples
